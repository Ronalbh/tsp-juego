<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSP por fuerza bruta</title>
<style>
:root{--bg:#f3f6f1;--ink:#1c2b22;--mute:#5f6f65;--line:#cfd9d1;--red:#e11d2e;--green:#2fb344;--blue:#1d4ed8;--ok:#1f8a3b;--bad:#b4231f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.7rem/1.2 Georgia,serif;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
svg{display:block;width:100%;height:auto}
.edge{stroke:var(--green);stroke-width:2}
.hl{stroke:var(--blue);stroke-width:6;stroke-linecap:round}
.wb{fill:#fff;stroke:var(--line)}
.w{font:700 11px "Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.nd{fill:#fff;stroke:var(--red);stroke-width:4}
.nt{font:700 16px "Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
h2{font:700 1.1rem Georgia,serif;margin:0 0 8px}
.et{color:var(--mute);font-size:.85rem;margin-bottom:6px}
button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:0 6px 6px 0}
button.p{background:var(--red);border-color:var(--red);color:#fff}
input,select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.pares{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0;max-height:240px;overflow:auto}
.pares label{font-size:.85rem}
.pares input{width:62px}
table{border-collapse:collapse;font-size:.85rem;width:100%}
td,th{border:1px solid var(--line);padding:3px 6px;text-align:center}
.sc{max-height:260px;overflow:auto;margin-bottom:8px}
.bad{color:var(--bad);font-weight:600}
.ok{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Problema del Agente Viajero</h1>
<p class="lead">Algoritmo de fuerza bruta, paso a paso.</p>
<div class="grid">
  <div class="card"><svg id="g" viewBox="0 0 520 520" role="img" aria-label="Grafo ponderado"></svg></div>
  <div class="card" id="p"></div>
</div>
</main>
<script>
const L="ABCDEFGHIJ",NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id),g=$("g");
let n=5,W=[],C=[],idx=0,paso=0,S=[],mas=50;
const pos=i=>{const a=-Math.PI/2+2*Math.PI*i/n;return[260+205*Math.cos(a),260+205*Math.sin(a)]};
const txt=p=>p.map(i=>L[i]).join(" → ")+" → "+L[0];
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e}
function vacio(){W=Array.from({length:n},()=>Array(n).fill(null))}
function setW(i,j,v){W[i][j]=W[j][i]=v}

function dib(p){
  g.innerHTML="";
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null){const[a,b]=pos(i),[c,d]=pos(j);el("line",{class:"edge",x1:a,y1:b,x2:c,y2:d})}
  if(p)p.forEach((v,k)=>{const u=p[(k+1)%p.length],[a,b]=pos(v),[c,d]=pos(u);el("line",{class:"hl",x1:a,y1:b,x2:c,y2:d})});
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null){
    const t=.25+((i*3+j*5)%6)/12,[a,b]=pos(i),[c,d]=pos(j),x=a+(c-a)*t,y=b+(d-b)*t,s=String(W[i][j]);
    el("rect",{class:"wb",x:x-s.length*4-4,y:y-9,width:s.length*8+8,height:18,rx:4});
    el("text",{class:"w",x,y}).textContent=s;
  }
  for(let i=0;i<n;i++){const[x,y]=pos(i);el("circle",{class:"nd",cx:x,cy:y,r:19});el("text",{class:"nt",x,y}).textContent=L[i]}
}

// Enumera todos los ciclos hamiltonianos (un ciclo y su inverso cuentan como uno)
function enumerar(){
  C=[];const vis=Array(n).fill(false),p=[0];vis[0]=true;
  (function d(c,k){
    if(k===n){const z=W[p[n-1]][0];if(z!=null&&p[1]<p[n-1])C.push({p:p.slice(0,n),c:+(c+z).toFixed(2)});return}
    for(let v=1;v<n;v++)if(!vis[v]&&W[p[k-1]][v]!=null){vis[v]=true;p[k]=v;d(c+W[p[k-1]][v],k+1);vis[v]=false}
  })(0,1);
}
// Si no hay ciclos, busca el ciclo que necesita menos aristas nuevas
function faltan(){
  let best=1e9,bp=null;const vis=Array(n).fill(false),p=[0];vis[0]=true;
  (function d(m,k){
    if(m>=best)return;
    if(k===n){const e=W[p[n-1]][0]==null?1:0;if(m+e<best){best=m+e;bp=p.slice(0,n)}return}
    for(let v=1;v<n;v++)if(!vis[v]){vis[v]=true;p[k]=v;d(m+(W[p[k-1]][v]==null?1:0),k+1);vis[v]=false}
  })(0,1);
  const r=[];bp.forEach((v,k)=>{const u=bp[(k+1)%n];if(W[v][u]==null)r.push(L[Math.min(v,u)]+"–"+L[Math.max(v,u)])});
  return r;
}
function azar(){
  vacio();const q=[...Array(n).keys()].sort(()=>Math.random()-.5);
  q.forEach((v,k)=>setW(v,q[(k+1)%n],1+Math.floor(Math.random()*30)));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]==null&&Math.random()<.5)setW(i,j,1+Math.floor(Math.random()*30));
}
function crear(){
  const v=+$("n").value;
  if(!Number.isInteger(v)||v<5||v>10){$("e").textContent="Ingresa un número entero entre 5 y 10.";return}
  const a=$("m").value==="a";n=v;vacio();
  if(a){azar();verificar()}else{paso=1;ui()}
}
function edit(i,j,v){setW(i,j,v!==""&&+v>0?+v:null);dib()}
function verificar(){
  enumerar();
  if(!C.length){const f=faltan();ui();$("e").innerHTML=`<p class="bad">El grafo no tiene ciclos hamiltonianos. Para completar al menos uno faltan estas aristas: ${f.join(", ")}.</p>`;return}
  paso=2;ui();
}
function ir(k){idx=Math.min(C.length-1,idx+k);ui()}
function resolver(){S=C.map((x,i)=>({i:i+1,p:x.p,c:x.c})).sort((a,b)=>a.c-b.c);mas=50;paso=4;ui()}

function ui(){
  const P=$("p"),et=k=>`<div class="et">Etapa ${k} de 5</div>`;
  if(paso===0){
    dib();
    P.innerHTML=et(1)+`<h2>Configurar el grafo</h2>
    <p>Número de nodos (5 a 10): <input id="n" type="number" min="5" max="10" value="${n}" style="width:70px"></p>
    <p>Generación: <select id="m"><option value="m">Manual</option><option value="a">Aleatoria</option></select></p>
    <div id="e" class="bad"></div><button class="p" onclick="crear()">Crear grafo</button>`;
  }else if(paso===1){
    dib();let h="";
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)h+=`<label>${L[i]}–${L[j]} <input type="number" min="0.1" step="any" value="${W[i][j]??""}" oninput="edit(${i},${j},this.value)"></label>`;
    P.innerHTML=et(1)+`<h2>Definir aristas y pesos</h2><p>Escribe el peso (distancia, costo o tiempo) de cada arista. Déjalo vacío si esa arista no existe.</p>
    <div class="pares">${h}</div><div id="e"></div><button class="p" onclick="verificar()">Verificar grafo</button><button onclick="paso=0;ui()">Volver</button>`;
  }else if(paso===2){
    dib();const m=W.flat().filter(x=>x!=null).length/2;
    P.innerHTML=et(2)+`<h2>Grafo verificado</h2><p class="ok">El grafo tiene ciclos hamiltonianos.</p>
    <p>${n} nodos y ${m} aristas. Total de ciclos hamiltonianos: <b>${C.length}</b> (cada ciclo y su inverso cuentan como uno).</p>
    <button class="p" onclick="idx=0;paso=3;ui()">Generar ciclos paso a paso</button><button onclick="paso=0;ui()">Nuevo grafo</button>`;
  }else if(paso===3){
    const c=C[idx];dib(c.p);let b=1e18;for(let i=0;i<=idx;i++)if(C[i].c<b)b=C[i].c;
    const u=C.slice(Math.max(0,idx-7),idx+1).reverse().map((x,k)=>`<tr><td>${idx+1-k}</td><td>${txt(x.p)}</td><td>${x.c}</td></tr>`).join("");
    P.innerHTML=et(3)+`<h2>Generación y evaluación de ciclos</h2>
    <p>Ciclo <b>${idx+1}</b> de ${C.length}: ${txt(c.p)}<br>Costo: <b>${c.c}</b> · Mejor hasta ahora: <b class="ok">${b}</b></p>
    <button onclick="ir(1)">Siguiente</button><button onclick="ir(10)">+10</button><button onclick="ir(100)">+100</button><button onclick="ir(1e9)">Al final</button><button onclick="idx=0;ui()">Reiniciar</button>
    <div class="sc"><table><tr><th>#</th><th>Ciclo</th><th>Costo</th></tr>${u}</table></div>
    <button class="p" onclick="resolver()">Continuar: matriz y costos</button>`;
  }else if(paso===4){
    dib();let t="<tr><th></th>"+[...Array(n).keys()].map(i=>`<th>${L[i]}</th>`).join("")+"</tr>";
    for(let i=0;i<n;i++){t+=`<tr><th>${L[i]}</th>`;for(let j=0;j<n;j++)t+=`<td>${i==j?0:W[i][j]??"∞"}</td>`;t+="</tr>"}
    const f=S.slice(0,mas).map(x=>`<tr><td>${x.i}</td><td>${txt(x.p)}</td><td>${x.c}</td></tr>`).join("");
    P.innerHTML=et(4)+`<h2>Matriz de costos</h2><div class="sc"><table>${t}</table></div>
    <h2>Costo de cada ciclo (de menor a mayor)</h2><div class="sc"><table><tr><th>#</th><th>Ciclo</th><th>Costo</th></tr>${f}</table></div>
    ${mas<S.length?`<button onclick="mas+=50;ui()">Mostrar 50 más</button>`:""}<button class="p" onclick="paso=5;ui()">Ver la solución</button>`;
  }else{
    const o=S[0],e=S.filter(x=>x.c===o.c).length;dib(o.p);
    P.innerHTML=et(5)+`<h2>Solución</h2><p>Total de ciclos hamiltonianos: <b>${S.length}</b></p>
    <p>Ciclo óptimo: <b>${txt(o.p)}</b></p>
    <p>Costo total mínimo: <b class="ok">${o.c}</b>${e>1?` (hay ${e} ciclos con ese mismo costo; se muestra uno)`:""}</p>
    <p>El ciclo óptimo está resaltado en azul sobre el grafo.</p>
    <button onclick="paso=4;ui()">Ver costos</button><button class="p" onclick="paso=0;ui()">Nuevo grafo</button>`;
  }
}
vacio();ui();
</script>
</body>
</html>
